// Plugins cho Spring Boot va Java
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.storex'
version = '1.0.0'

// Cau hinh toolchain Java 17
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// Cac thu vien phu thuoc
dependencies {
    // Spring Boot Starter co ban
    implementation 'org.springframework.boot:spring-boot-starter'

    // Spring Kafka ho tro Consumer va Producer
    implementation 'org.springframework.kafka:spring-kafka'

    // Jackson de serialize va deserialize JSON
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Lombok ho tro giam code boilerplate
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Thu vien kiem thu Spring Boot va Embedded Kafka
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.awaitility:awaitility:4.2.2'
}

// Cau hinh thuc thi kiem thu voi JUnit Platform
tasks.named('test') {
    useJUnitPlatform()
}
